{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:380px;margin:60px auto;">
  <h2>注册</h2>
  <form method="post">
    <label class="req">用户名</label>
    <input name="username" required>
    <label>姓名</label>
    <input name="name">
    <label>角色</label>
    <select name="role">
      <option value="ziliaoyuan">资料员</option>
      <option value="jingli">项目经理</option>
      <option value="jianli">监理</option>
    </select>
    <label class="req">密码</label>
    <input name="password" type="password" required>
    <br><br>
    <button class="btn" style="width:100%">注册</button>
  </form>
  <p class="muted" style="margin-top:14px"><a href="{{ url_for('auth.login') }}">返回登录</a></p>
</div>
{% endblock %}
